<title>Runnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=DM+Mono:wght@400&display=swap">
<style>
/* Layout: a sand table seen from above, edge to edge. A title and a hint surface, then sink; two small tools stay in the corner. */
:root {
  --ground: #b89d76;
  --ink: #2b2118;
  --ink-soft: rgba(43, 33, 24, .6);
  --chip: rgba(250, 243, 230, .78);
  --chip-on: #2b2118;
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden; font: 11px/1.5 var(--f-mono); user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.fade { transition: opacity 3s ease; }
.gone { opacity: 0 !important; }
.title { position: fixed; top: max(20px, env(safe-area-inset-top, 0px)); left: 24px; margin: 0; font: italic 500 34px/1 var(--f-display); color: var(--ink); pointer-events: none; text-shadow: 0 1px 14px rgba(255, 245, 225, .5); }
.hint { position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--ink); letter-spacing: .14em; pointer-events: none; padding-inline: 80px; text-shadow: 0 1px 10px rgba(255, 245, 225, .7); }
.tools { position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
.tools button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--chip); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 2px 10px rgba(60, 40, 20, .25); }
.tools button[aria-pressed="true"] { background: var(--chip-on); color: #f6eee0; }
.tools button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.tools svg { width: 20px; height: 20px; }
.meter { position: fixed; right: 18px; top: 50%; width: 3px; height: 140px; transform: translateY(-50%); background: rgba(43, 33, 24, .18); border-radius: 2px; pointer-events: none; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; background: #2d6f78; border-radius: 2px; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: italic 500 22px/1.4 var(--f-display); }
.fallback[hidden] { display: none; }
@media (max-width: 640px) { .hint { padding-inline: 70px 16px; text-align: right; letter-spacing: .06em; } }
@media (prefers-reduced-motion: reduce) { .fade { transition: none; } }
</style>

<canvas id="c" aria-label="A stream running through sand. Press and drag to pile sand and block it; alt-drag or press 2 to push sand; right-drag or hold Shift to dig; press 4 to pour water."></canvas>
<h1 class="title fade" id="title">Runnel</h1>
<div class="hint fade" id="hint">drag to pile sand · 2 push · 3 dig · 4 pour water · scroll for more water · R to smooth it over</div>
<div class="tools" role="group" aria-label="Tool">
  <button id="tPile" aria-pressed="true" aria-label="Pile sand" title="Pile sand (1)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 16 C6 16 7 7 10 7 C13 7 14 16 18 16 Z" fill="currentColor"/></svg></button>
  <button id="tPush" aria-pressed="false" aria-label="Push sand" title="Push sand (2)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 15 H11 C14 15 15 11 18 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M13 5 L17 8 L13 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="tWater" aria-pressed="false" aria-label="Pour water" title="Pour water (4)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5 C10 2.5 4.5 9 4.5 12.5 A5.5 5.5 0 0 0 15.5 12.5 C15.5 9 10 2.5 10 2.5 Z" fill="currentColor"/></svg></button>
  <button id="tDig" aria-pressed="false" aria-label="Dig" title="Dig (3)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6 C6 6 7 15 10 15 C13 15 14 6 18 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</div>
<div class="meter fade gone" id="meter"><i id="meterFill"></i></div>
<div class="fallback" id="fallback" hidden>This stream needs WebGL 2 with float render targets, which this browser isn't offering.</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { $('fallback').hidden = false; return; }
const LINEAR_OK = !!gl.getExtension('OES_texture_float_linear');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEPS = REDUCED ? 2 : 3;
const DT = .08;

/* The model. One grid cell is one length unit; heights use the same unit.
   Water:  local-inertial shallow water (Bates et al. 2010) with Manning bed friction.
           Discharge lives on cell faces. Friction grows as depth shrinks, so thin sheets
           barely move and water gathers into whatever path is deepest.
   Sand:   bedload by excess shear (Meyer-Peter–Müller form) along the local flow, turned toward
           the inside of bends by helical flow and deflected down the bed slope; then the Exner
           equation: the bed rises or falls by exactly the sand that arrives or leaves.
           Below the threshold, water moves no sand at all.
   Banks:  anything steeper than the angle of repose avalanches; wet sand stands lower.
   Soil:   water percolates into the sand, faster where the sand is still dry.            */
const PRM = {
  g: 9.81,
  n: .12,          // Manning roughness
  thc: .008,       // threshold of motion
  kq: 80,          // bedload coefficient
  beta: 1.1,       // slope deflection of moving sand
  helix: 20,       // strength of the spiral flow round bends (Engelund's A)
  feed: .06,       // sand load the river brings out of the canyon
  slope: .05,      // fall of the table per cell
  morf: 12,        // morphological acceleration
  perc: .0003,     // percolation into saturated sand
  absorb: .05,     // how fast dry sand drinks
  hold: .03,       // how much water dry sand holds before it is saturated
  reposeDry: .75,
  reposeWet: .5,
  reposeDamp: 1.3,
};
let Q = 4;         // spring discharge, volume per time

// ---------- shaders ----------
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const COMMON = `
precision highp float;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+1.), f.x), f.y); }
float fbm(vec2 p){ return .5*n2(p) + .28*n2(p*2.03+7.) + .14*n2(p*4.1+3.) + .08*n2(p*8.3+1.); }
uniform vec2 G; uniform float SEED; uniform float SLOPE;
float meander(float y){ return G.x*.5 + sin(y*.012 + SEED)*G.x*.05 + sin(y*.031 + SEED*2.3)*G.x*.015; }
// The top of the table is a rock canyon: fixed walls, a steeper bed, the spring at its head.
float canyon(vec2 c){ float e = (fbm(vec2(c.x*.07, SEED*1.7)) - .5)*G.y*.16; return smoothstep(G.y*.8 + e, G.y*.87 + e, c.y); }
float halfw(float y){ return G.x*.018 + 2.*n2(vec2(y*.06, SEED)); }
float rockMask(vec2 c){ return canyon(c)*smoothstep(halfw(c.y), halfw(c.y) + 2.5, abs(c.x - meander(c.y))); }
// Below the canyon: a tilted sand bed with gentle roughness and a faint, winding valley floor leaving the canyon mouth.
// It only suggests a course; the bend flow and damp banks do the rest.
float valleyX(float y){
  float from = clamp((G.y*.8 - y)/(G.y*.12), 0., 1.);
  return meander(G.y*.8) + sin((G.y*.8 - y)/(G.y*.42)*6.2832 + SEED)*G.x*.07*from*from*(3. - 2.*from);
}
float base(vec2 c){
  float cz = canyon(c);
  float side = smoothstep(halfw(c.y), halfw(c.y) + 3.5, abs(c.x - meander(c.y)));
  float wall = side*(9. + fbm(c*.05 + SEED)*6.)*cz;
  float cobbles = (1. - side)*cz*fbm(c*.45 + SEED*5.)*.55;
  float drop = cz*max(c.y - G.y*.8, 0.)*.1;
  float rim = pow(abs(c.x/G.x - .5)*2., 3.)*6.;
  float valley = (1. - cz)*1.3*exp(-pow((c.x - valleyX(c.y))/(G.x*.03), 2.));
  return 8. + c.y*SLOPE + fbm(c*.02 + SEED)*1.4 + fbm(c*.09 + SEED*3.)*.4 + rim + wall + drop + cobbles - valley;
}`;
const FS_INIT = `#version 300 es
${COMMON}
layout(location=0) out vec4 o;
// state: x = surface of the ground, y = water depth, z = wetness, w = rock floor (sand lies on top of it; nothing cuts below)
// the bottom rows are a fixed lip: the river's base level, so it stops cutting down and starts working sideways
void main(){ vec2 c = gl_FragCoord.xy; float r = (canyon(c) >= .3 || c.y < 2.) ? base(c) : 0.; o = vec4(base(c), 0., 0., r); }`;

// 1. Water momentum on faces. x = discharge through the right face, y = through the top face.
const FS_FLUX = `#version 300 es
${COMMON}
uniform sampler2D ST, FL; uniform float DT, GRAV, MANN;
layout(location=0) out vec4 o;
float face(float q, vec2 a, vec2 b){
  float ea = a.x + a.y, eb = b.x + b.y;
  float hf = max(ea, eb) - max(a.x, b.x);
  if (hf <= 1e-4) return 0.;
  // Stability: a gravity wave must not cross more than ~2/3 of a cell per step, so very deep water feels softened gravity.
  float ge = min(GRAV, .45/(DT*DT*hf));
  float qn = (q - ge*hf*DT*(eb - ea))/(1. + ge*DT*MANN*MANN*abs(q)/pow(hf, 7./3.));
  qn = clamp(qn, -4.*hf, 4.*hf);
  return (isnan(qn) || isinf(qn)) ? 0. : qn;
}
float fx(ivec2 q){ return (q.x < 0 || q.x >= int(G.x)) ? 0. : texelFetch(FL, q, 0).x; }
float fy(ivec2 q){ return (q.y < 0 || q.y >= int(G.y)) ? 0. : texelFetch(FL, q, 0).y; }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy), g = ivec2(G), ex = ivec2(1, 0), ey = ivec2(0, 1);
  vec2 a = texelFetch(ST, p, 0).xy;
  // de Almeida et al. (2012): blend each face's discharge with its neighbours' to damp checkerboard oscillation
  const float TH = .8;
  float fxo = TH*fx(p) + (1. - TH)*.5*(fx(p - ex) + fx(p + ex));
  float fyo = TH*fy(p) + (1. - TH)*.5*(fy(p - ey) + fy(p + ey));
  float qx = p.x < g.x - 1 ? face(fxo, a, texelFetch(ST, p + ex, 0).xy) : 0.;
  float qy = p.y < g.y - 1 ? face(fyo, a, texelFetch(ST, p + ey, 0).xy) : 0.;
  o = vec4(qx, qy, 0., 0.);
}`;

// 1b. Mass limiter: scale each cell's outgoing faces so it never sends more water than it holds.
//     Without this, over-drained cells go negative, get clamped to zero, and water is made from nothing.
const FS_LIMIT = `#version 300 es
${COMMON}
uniform sampler2D ST, FL; uniform float DT;
layout(location=0) out vec4 o;
float qx(ivec2 c){ return (c.x < 0 || c.y < 0 || c.x >= int(G.x) || c.y >= int(G.y)) ? 0. : texelFetch(FL, c, 0).x; }
float qy(ivec2 c){ return (c.x < 0 || c.y < 0 || c.x >= int(G.x) || c.y >= int(G.y)) ? 0. : texelFetch(FL, c, 0).y; }
float k(ivec2 c){
  ivec2 ex = ivec2(1, 0), ey = ivec2(0, 1);
  float out_ = max(qx(c), 0.) + max(-qx(c - ex), 0.) + max(qy(c), 0.) + max(-qy(c - ey), 0.);
  float d = texelFetch(ST, clamp(c, ivec2(0), ivec2(G) - 1), 0).y;
  return out_*DT > d ? d/(out_*DT) : 1.;
}
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  float x = qx(p), y = qy(p);
  x *= x > 0. ? k(p) : k(p + ivec2(1, 0));
  y *= y > 0. ? k(p) : k(p + ivec2(0, 1));
  o = vec4(x, y, 0., 0.);
}`;

// 2. Water mass: move it, feed the spring, spill off the bottom edge, soak into the sand. Also cell velocity.
const FS_WATER = `#version 300 es
${COMMON}
uniform sampler2D ST, FL; uniform float DT, GRAV, MANN, THC, QIN, SRC, SIG, PERC, ABSORB, HOLD; uniform vec4 WS;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
vec2 F(ivec2 q){ return (q.x < 0 || q.y < 0) ? vec2(0.) : texelFetch(FL, q, 0).xy; }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(ST, p, 0);
  vec2 f = F(p), fl = F(p - ivec2(1, 0)), fb = F(p - ivec2(0, 1));
  float d = s.y + DT*(fl.x - f.x + fb.y - f.y);
  if (p.y == int(G.y) - 1) d += DT*QIN*exp(-pow((gl_FragCoord.x - SRC)/SIG, 2.))/(SIG*1.7725);
  if (WS.w > 0.) { float dd = length(gl_FragCoord.xy - WS.xy); d += DT*WS.w*exp(-dd*dd/(WS.z*WS.z))/(3.1416*WS.z*WS.z); }
  if (p.y == 0) d -= DT*max(d, 0.)*sqrt(GRAV*max(d, 0.));
  // dry sand drinks until it holds its fill (HOLD of depth), then only slow percolation remains, faster under deeper water
  d = max(d, 0.);
  float soil = s.w > 0. ? smoothstep(0., .5, s.x - s.w) : 1.;   // bare rock drinks nothing
  float take = min(d, DT*ABSORB*(1. - s.z)*soil);
  d -= take;
  float wet = s.z + take/HOLD;
  d = max(d - DT*PERC*(1. + 4.*d)*step(1e-5, d)*soil, 0.);
  if (d <= 1e-5) wet -= DT*.004;
  wet = clamp(wet, 0., 1.);
  if (isnan(d) || isinf(d)) d = 0.;
  vec2 u = d > .004 ? vec2(fl.x + f.x, fb.y + f.y)*.5/max(d, .02) : vec2(0.);
  float th = d > .015 ? MANN*MANN*dot(u, u)/pow(d, 1./3.) : 0.;
  o0 = vec4(s.x, d, wet, s.w);
  o1 = vec4(u, max(th - THC, 0.), 0.);
}`;

// 2b. Sediment flux as a vector at each cell, along the actual flow, so channels aren't pinned to grid angles.
//     Helical flow: round a bend the water spirals, sweeping bed sand toward the inside of the curve
//     (Engelund: tan δ = A·h/r). Outer banks erode, point bars grow inside, and bends grow into meanders.
const FS_QS = `#version 300 es
${COMMON}
uniform sampler2D ST, VEL; uniform float MANN, THC, KQ, BETA, HELIX, FEED;
layout(location=0) out vec4 o;
vec2 U(ivec2 q){ return texelFetch(VEL, clamp(q, ivec2(0), ivec2(G) - 1), 0).xy; }
float Bh(ivec2 q){ return texelFetch(ST, clamp(q, ivec2(0), ivec2(G) - 1), 0).x; }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy), ex = ivec2(1, 0), ey = ivec2(0, 1);
  vec4 s = texelFetch(ST, p, 0);
  vec2 u = U(p); float d = s.y, sp = length(u);
  o = vec4(0.);
  // The canyon delivers sand: water running over bare rock carries a steady load (the bed-pass clamp to the rock
  // floor supplies it), which the river drops wherever it slows, above all on the inside of bends.
  if (s.w > 0. && s.x - s.w < .02) {
    // only at the mouth, where the rock floor meets sand, so the load has one source
    bool mouth = texelFetch(ST, clamp(p - ey, ivec2(0), ivec2(G) - 1), 0).w == 0. || texelFetch(ST, clamp(p + ex, ivec2(0), ivec2(G) - 1), 0).w == 0. || texelFetch(ST, clamp(p - ex, ivec2(0), ivec2(G) - 1), 0).w == 0.;
    if (mouth && d > .03 && sp > .05) o = vec4(FEED*u/sp*min(d*3., 1.), 0., 0.);
    return;
  }
  if (d < .015 || sp < 1e-3) return;
  float exs = MANN*MANN*sp*sp/pow(d, 1./3.) - THC;
  if (exs <= 0.) return;
  float mag = KQ*exs*sqrt(exs);
  vec2 adv = u.x*(U(p + ex) - U(p - ex))*.5 + u.y*(U(p + ey) - U(p - ey))*.5;
  float kappa = (u.x*adv.y - u.y*adv.x)/(sp*sp*sp);
  float dl = clamp(atan(HELIX*d*kappa), -.8, .8), c = cos(dl), sn = sin(dl);
  vec2 dir = u/sp; dir = vec2(c*dir.x - sn*dir.y, sn*dir.x + c*dir.y);
  vec2 gb = vec2(Bh(p + ex) - Bh(p - ex), Bh(p + ey) - Bh(p - ey))*.5;
  vec2 q = mag*(dir - BETA*gb);
  float l = length(q); if (l > .4) q *= .4/l;
  o = vec4(q, 0., 0.);
}`;

// 3. The bed: sediment through each face (flux-split from the cell vectors), Exner update, avalanching, the hand, the fixed canyon.
const FS_BED = `#version 300 es
${COMMON}
uniform sampler2D ST, QS; uniform float DT, MORF, RDRY, RWET, RDAMP; uniform vec4 BR, PU;
layout(location=0) out vec4 o;
float B(ivec2 q){ q = clamp(q, ivec2(0), ivec2(G) - 1); return texelFetch(ST, q, 0).x; }
float sandOn(vec4 c){ return c.x - c.w; }   // loose sand above the rock floor (the floor is 0 outside the canyon)
vec2 Q(ivec2 q){ return (q.x < 0 || q.y < 0 || q.x >= int(G.x) || q.y >= int(G.y)) ? vec2(0.) : texelFetch(QS, q, 0).xy; }
// flux splitting: what leaves a toward b plus what leaves b toward a
float face(float a, float b){ return max(a, 0.) + min(b, 0.); }
vec2 qp(ivec2 q){
  float r = BR.z*1.4;
  float w = 1. - smoothstep(r*.5, r, length(vec2(q) + .5 - PU.xy));
  vec4 c = texelFetch(ST, clamp(q, ivec2(0), ivec2(G) - 1), 0);
  return PU.zw*w*clamp(sandOn(c), 0., 3.5);
}
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy), g = ivec2(G), ex = ivec2(1, 0), ey = ivec2(0, 1);
  vec4 s = texelFetch(ST, p, 0);
  vec2 qc = Q(p);
  float qR = p.x < g.x - 1 ? face(qc.x, Q(p + ex).x) : 0.;
  float qL = p.x > 0 ? face(Q(p - ex).x, qc.x) : 0.;
  float qT = p.y < g.y - 1 ? face(qc.y, Q(p + ey).y) : 0.;
  float qB = p.y > 0 ? face(Q(p - ey).y, qc.y) : min(qc.y, 0.);
  float b = s.x - MORF*DT*(qR - qL + qT - qB);
  // Avalanching. Each pair of cells agrees on one angle of repose (wet if either is under water) and on how much
  // loose sand the higher one can give, so sand is only ever moved, never made. Bare rock gives nothing.
  float acc = 0.;
  for (int k = 0; k < 8; k++) {
    ivec2 o = k == 0 ? ex : k == 1 ? -ex : k == 2 ? ey : k == 3 ? -ey : k == 4 ? ivec2(1, 1) : k == 5 ? ivec2(-1, -1) : k == 6 ? ivec2(1, -1) : ivec2(-1, 1);
    ivec2 q = p + o;
    if (q.x < 0 || q.y < 0 || q.x >= g.x || q.y >= g.y) continue;
    vec4 nb = texelFetch(ST, q, 0);
    // submerged sand slumps lowest; damp sand above the water stands steepest (the sandcastle effect), so banks hold
    float T = (s.y > .01 || nb.y > .01) ? RWET : (min(s.z, nb.z) > .3 ? RDAMP : RDRY);
    float dist = k < 4 ? 1. : 1.41421, dl = nb.x - s.x;
    float t = .075*max(abs(dl) - T*dist, 0.)/(dist*dist);
    t = min(t, .2*max(sandOn(dl > 0. ? nb : s), 0.));
    acc += sign(dl)*t;
  }
  b += acc;
  if (BR.w != 0.) { float dd = length(gl_FragCoord.xy - BR.xy); b += BR.w*exp(-dd*dd/(BR.z*BR.z)); }
  if (PU.z != 0. || PU.w != 0.) b -= (qp(p + ex).x - qp(p - ex).x + qp(p + ey).y - qp(p - ey).y)*.5;
  if (isnan(b) || isinf(b)) b = s.w;
  o = vec4(max(b, s.w), s.y, s.z, s.w);
}`;

// Cast shadows from a low sun, at grid resolution.
const FS_SHADOW = `#version 300 es
${COMMON}
uniform sampler2D ST;
layout(location=0) out vec4 o;
float Hs(vec2 c){ vec4 s = texture(ST, c/G); return s.x + s.y; }
void main(){
  vec2 c = gl_FragCoord.xy, dir = vec2(-.77, .64);
  float h0 = Hs(c), sh = 1.;
  for (int i = 1; i <= 32; i++) {
    vec2 q = c + dir*float(i)*1.2;
    if (q.x < 0. || q.y < 0. || q.x > G.x || q.y > G.y) break;
    sh = min(sh, clamp(1. - (Hs(q) - h0 - 1.1*float(i)*1.2)*.8, 0., 1.));
  }
  o = vec4(sh, 0., 0., 1.);
}`;

// The picture: raking light and shadow on the sand so every cut reads; water that deepens in colour
// with depth, shows moving sand as a tan shimmer, and foams where it runs fast.
const FS_DRAW = `#version 300 es
${COMMON}
uniform sampler2D ST, VEL, SH; uniform vec2 R; uniform float TIME;
layout(location=0) out vec4 o;
const vec3 SUN = vec3(-.55, .46, .7);
vec4 S(vec2 uv){ return texture(ST, uv); }
vec3 sand(vec2 uv, float shk){
  vec2 e = 1./G, c = uv*G;
  vec2 g = vec2(S(uv + vec2(e.x, 0.)).x - S(uv - vec2(e.x, 0.)).x, S(uv + vec2(0., e.y)).x - S(uv - vec2(0., e.y)).x)*.5;
  g += vec2(.015, .045)*cos(c.y*1.1 + c.x*.25 + fbm(c*.12)*7.)*(.6 + .4*n2(c*.05));
  vec3 N = normalize(vec3(-g*1.7, 1.));
  float dif = max(dot(N, SUN), 0.)*mix(1., texture(SH, uv).r, shk);
  vec4 s = S(uv);
  vec3 alb = mix(vec3(.8, .67, .49), vec3(.91, .81, .63), fbm(c*.045 + 3.));

let AC = null, SND = {};
