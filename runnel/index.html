<title>Runnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=DM+Mono:wght@400&display=swap">
<style>
/* Layout: a sand table seen from above, edge to edge. A title and a hint surface, then sink; two small tools stay in the corner. */
:root {
  --ground: #b89d76;
  --ink: #2b2118;
  --ink-soft: rgba(43, 33, 24, .6);
  --chip: rgba(250, 243, 230, .78);
  --chip-on: #2b2118;
  --f-display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); overflow: hidden; font: 11px/1.5 var(--f-mono); user-select: none; -webkit-user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.fade { transition: opacity 3s ease; }
.gone { opacity: 0 !important; }
.title { position: fixed; top: max(20px, env(safe-area-inset-top, 0px)); left: 24px; margin: 0; font: italic 500 34px/1 var(--f-display); color: var(--ink); pointer-events: none; text-shadow: 0 1px 14px rgba(255, 245, 225, .5); }
.hint { position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--ink); letter-spacing: .14em; pointer-events: none; padding-inline: 80px; text-shadow: 0 1px 10px rgba(255, 245, 225, .7); }
.tools { position: fixed; left: 16px; bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
.tools button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--chip); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 2px 10px rgba(60, 40, 20, .25); }
.tools button[aria-pressed="true"] { background: var(--chip-on); color: #f6eee0; }
.tools button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.tools svg { width: 20px; height: 20px; }
.meter { position: fixed; right: 18px; top: 50%; width: 3px; height: 140px; transform: translateY(-50%); background: rgba(43, 33, 24, .18); border-radius: 2px; pointer-events: none; }
.meter i { position: absolute; left: 0; right: 0; bottom: 0; background: #2d6f78; border-radius: 2px; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: italic 500 22px/1.4 var(--f-display); }
.fallback[hidden] { display: none; }
@media (max-width: 640px) { .hint { padding-inline: 70px 16px; text-align: right; letter-spacing: .06em; } }
@media (prefers-reduced-motion: reduce) { .fade { transition: none; } }
</style>

<canvas id="c" aria-label="A stream running through sand. Press and drag to pile sand and block it; alt-drag or press 2 to push sand; right-drag or hold Shift to dig."></canvas>
<h1 class="title fade" id="title">Runnel</h1>
<div class="hint fade" id="hint">drag to pile sand · alt-drag or 2 to push it · right-drag to dig · scroll for more water · R to smooth it over</div>
<div class="tools" role="group" aria-label="Tool">
  <button id="tPile" aria-pressed="true" aria-label="Pile sand" title="Pile sand (1)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 16 C6 16 7 7 10 7 C13 7 14 16 18 16 Z" fill="currentColor"/></svg></button>
  <button id="tPush" aria-pressed="false" aria-label="Push sand" title="Push sand (2)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 15 H11 C14 15 15 11 18 11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M13 5 L17 8 L13 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button id="tDig" aria-pressed="false" aria-label="Dig" title="Dig (3)"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 6 C6 6 7 15 10 15 C13 15 14 6 18 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</div>
<div class="meter fade gone" id="meter"><i id="meterFill"></i></div>
<div class="fallback" id="fallback" hidden>This stream needs WebGL 2 with float render targets, which this browser isn't offering.</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('c');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) { $('fallback').hidden = false; return; }
const LINEAR_OK = !!gl.getExtension('OES_texture_float_linear');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEPS = REDUCED ? 2 : 3;
const DT = .08;

// ---------- shaders ----------
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }`;
const COMMON = `
precision highp float;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
  return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+1.), f.x), f.y); }
float fbm(vec2 p){ return .5*n2(p) + .28*n2(p*2.03+7.) + .14*n2(p*4.1+3.) + .08*n2(p*8.3+1.); }
uniform vec2 G; uniform float SEED;
float meander(float y){ return G.x*.5 + sin(y*.017 + SEED)*G.x*.15 + sin(y*.043 + SEED*2.3)*G.x*.05; }
float base(vec2 c){
  float valley = 3.5*exp(-pow((c.x - meander(c.y))/(G.x*.06), 2.));
  float banks = pow(abs(c.x/G.x - .5)*2., 2.)*5.;
  return 6. + c.y*.045 + fbm(c*.018 + SEED)*5. + fbm(c*.07 + SEED*3.)*1.2 + banks - valley;
}`;
const FS_INIT = `#version 300 es
${COMMON}
layout(location=0) out vec4 o;
void main(){ o = vec4(base(gl_FragCoord.xy), 0., 0., 0.); }`;
const FS_CLEAR = `#version 300 es
precision highp float; layout(location=0) out vec4 o; void main(){ o = vec4(0.); }`;

// 1. Pipe model: water flows to each neighbour in proportion to the difference in surface height.
const FS_FLUX = `#version 300 es
${COMMON}
uniform sampler2D ST, FL; uniform float DT;
layout(location=0) out vec4 o;
float H(ivec2 q){ vec4 s = texelFetch(ST, q, 0); return s.x + s.y; }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy), g = ivec2(G);
  vec4 s = texelFetch(ST, p, 0); float hc = s.x + s.y;
  float hL = p.x > 0 ? H(p + ivec2(-1, 0)) : 1e4;
  float hR = p.x < g.x-1 ? H(p + ivec2(1, 0)) : 1e4;
  float hB = p.y > 0 ? H(p + ivec2(0, -1)) : hc - 1.5;
  float hT = p.y < g.y-1 ? H(p + ivec2(0, 1)) : 1e4;
  vec4 f = texelFetch(FL, p, 0);
  // bed friction: thin sheets of water drag on the sand far more than deep channels do
  float damp = mix(.86, .985, smoothstep(.02, .8, s.y));
  vec4 nf = max(vec4(0.), f*damp + DT*9.81*vec4(hc-hL, hc-hR, hc-hB, hc-hT));
  float sum = nf.x + nf.y + nf.z + nf.w;
  if (sum > 0.) nf *= min(1., s.y/(sum*DT));
  o = nf;
}`;
// 2. Move the water, derive velocity, then erode or deposit against the flow's carrying capacity.
const FS_WATER = `#version 300 es
${COMMON}
uniform sampler2D ST, FL; uniform float DT, Q, SRC, KC, KS, KD;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
vec4 F(ivec2 q){ return (q.x < 0 || q.y < 0 || q.x >= int(G.x) || q.y >= int(G.y)) ? vec4(0.) : texelFetch(FL, q, 0); }
float B(ivec2 q){ q = clamp(q, ivec2(0), ivec2(G) - 1); return texelFetch(ST, q, 0).x; }
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(ST, p, 0), f = F(p);
  vec4 fl = F(p + ivec2(-1, 0)), fr = F(p + ivec2(1, 0)), fb = F(p + ivec2(0, -1)), ft = F(p + ivec2(0, 1));
  float inflow = fl.y + fr.x + fb.w + ft.z;
  float outflow = f.x + f.y + f.z + f.w;
  float d0 = s.y;
  float d = max(0., d0 + DT*(inflow - outflow));
  if (float(p.y) > G.y - 4.) d += DT*Q*exp(-pow((gl_FragCoord.x - SRC)/7., 2.));
  float wx = (fl.y - f.x + f.y - fr.x)*.5;
  float wy = (fb.w - f.z + f.w - ft.z)*.5;
  vec2 v = vec2(wx, wy)/max((d0 + d)*.5, .03);
  float sp = length(v); if (sp > 3.) v *= 3./sp;
  vec2 gb = vec2(B(p + ivec2(1, 0)) - B(p + ivec2(-1, 0)), B(p + ivec2(0, 1)) - B(p + ivec2(0, -1)))*.5;
  float sl = length(gb), sinA = sl/sqrt(1. + sl*sl);
  // stream power: deep, fast water carries far more than a thin sheet, so flow that gathers cuts deeper and gathers more
  float C = KC*length(v)*min(d, 1.2)*(.4 + 3.*sinA);
  float b = s.x, sed = s.z;
  if (C > sed) { float a = min(min(KS*(C - sed), .02), max(b, 0.)); b -= a; sed += a; }
  else { float a = KD*(sed - C); b += a; sed -= a; }
  d = max(0., d - DT*.0006);
  if (p.y == 0) sed *= .5;
  float wet = max(s.w - DT*.0035, step(.012, d));
  o0 = vec4(b, d, sed, wet);
  o1 = vec4(v, 0., 0.);
}`;
// 3. Carry sediment downstream, let steep sand slump to its angle of repose, apply the hand.
const FS_SEDI = `#version 300 es
${COMMON}
uniform sampler2D ST, VEL; uniform float DT; uniform vec4 BR; uniform vec4 PU;
layout(location=0) out vec4 o;
float B(ivec2 q){ q = clamp(q, ivec2(0), ivec2(G) - 1); return texelFetch(ST, q, 0).x; }
vec4 bil(vec2 c){
  c = clamp(c - .5, vec2(0.), G - 1.001); ivec2 i = ivec2(floor(c)); vec2 f = fract(c);
  return mix(mix(texelFetch(ST, i, 0), texelFetch(ST, i + ivec2(1, 0), 0), f.x), mix(texelFetch(ST, i + ivec2(0, 1), 0), texelFetch(ST, i + ivec2(1, 1), 0), f.x), f.y);
}
vec2 qp(ivec2 q){
  float r = BR.z*1.4;
  float w = 1. - smoothstep(r*.5, r, length(vec2(q) + .5 - PU.xy));
  return PU.zw*w*min(B(q), 3.5);
}
void main(){
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec4 s = texelFetch(ST, p, 0);
  vec2 v = texelFetch(VEL, p, 0).xy;
  float sed = bil(gl_FragCoord.xy - v*DT).z;
  float b = s.x;
  float T = s.y > .01 ? mix(.5, .28, clamp(length(v)/2., 0., 1.)) : .75;
  // slump toward all eight neighbours, diagonals at their true distance, so piles settle into round cones
  float acc = 0.;
  for (int k = 0; k < 8; k++) {
    ivec2 o = k == 0 ? ivec2(1, 0) : k == 1 ? ivec2(-1, 0) : k == 2 ? ivec2(0, 1) : k == 3 ? ivec2(0, -1)
            : k == 4 ? ivec2(1, 1) : k == 5 ? ivec2(-1, -1) : k == 6 ? ivec2(1, -1) : ivec2(-1, 1);
    float dist = k < 4 ? 1. : 1.41421;
    float dl = B(p + o) - b;
    acc += sign(dl)*max(abs(dl) - T*dist, 0.)/(dist*dist);
  }
  b += .075*acc;
  if (BR.w != 0.) { float dd = length(gl_FragCoord.xy - BR.xy); b += BR.w*exp(-dd*dd/(BR.z*BR.z)); }
  // the plough: sand flux along the drag, strongest under the finger; its divergence takes from behind and heaps in front
  if (PU.z != 0. || PU.w != 0.) {
    ivec2 ex = ivec2(1, 0), ey = ivec2(0, 1);
    float div = (qp(p + ex).x - qp(p - ex).x + qp(p + ey).y - qp(p - ey).y)*.5;
    b -= div;
  }
  if (gl_FragCoord.y > G.y - 10.) b = mix(b, base(gl_FragCoord.xy), .02);
  o = vec4(max(b, 0.), s.y, max(sed, 0.), s.w);
}`;
// The picture: lit sand, darkened where wet; water that refracts, absorbs, reflects the sky and foams where it runs fast.
const FS_DRAW = `#version 300 es
${COMMON}
uniform sampler2D ST, VEL; uniform vec2 R; uniform float TIME;
layout(location=0) out vec4 o;
const vec3 SUN = normalize(vec3(-.5, .55, .68));
vec4 S(vec2 uv){ return texture(ST, uv); }
vec3 sand(vec2 uv){
  vec2 e = 1./G, c = uv*G;
  vec2 g = vec2(S(uv + vec2(e.x, 0.)).x - S(uv - vec2(e.x, 0.)).x, S(uv + vec2(0., e.y)).x - S(uv - vec2(0., e.y)).x)*.5;
  float rp = c.y*1.1 + c.x*.25 + fbm(c*.12)*7.;
  g += vec2(.02, .06)*cos(rp)*(.6 + .4*n2(c*.05));
  vec3 N = normalize(vec3(-g*.9, 1.));
  float dif = clamp(dot(N, SUN), 0., 1.);
  vec4 s = S(uv);
  vec3 alb = mix(vec3(.78, .65, .47), vec3(.9, .8, .62), fbm(c*.045 + 3.));
  alb *= .93 + .14*h(floor(uv*R*.8));
  alb = mix(vec3(.42, .36, .3), alb, smoothstep(.3, 2.5, s.x));
  alb = mix(alb, alb*vec3(.56, .49, .42), s.w*.85);
  float wide = (S(uv + vec2(5.*e.x, 0.)).x + S(uv - vec2(5.*e.x, 0.)).x + S(uv + vec2(0., 5.*e.y)).x + S(uv - vec2(0., 5.*e.y)).x)*.25;
  float ao = 1. - .35*smoothstep(0., 2., wide - s.x);
  return alb*(.5 + .62*dif)*ao;
}
vec2 gradN(vec2 q){ float a = fbm(q), bx = fbm(q + vec2(.05, 0.)), by = fbm(q + vec2(0., .05)); return vec2(bx - a, by - a)/.05; }
void main(){
  vec2 uv = gl_FragCoord.xy/R, e = 1./G, c = uv*G;
  vec4 s = S(uv);
  float d = s.y;
  vec3 col = sand(uv);
  if (d > .0015) {
    float Hl = S(uv - vec2(e.x, 0.)).x + S(uv - vec2(e.x, 0.)).y, Hr = S(uv + vec2(e.x, 0.)).x + S(uv + vec2(e.x, 0.)).y;
    float Hb = S(uv - vec2(0., e.y)).x + S(uv - vec2(0., e.y)).y, Ht = S(uv + vec2(0., e.y)).x + S(uv + vec2(0., e.y)).y;
    vec2 gh = vec2(Hr - Hl, Ht - Hb)*.5;
    vec2 v = texture(VEL, uv).xy;
    float sp = length(v);
    float ph = TIME*.35, p1 = fract(ph), p2 = fract(ph + .5), w = abs(p1*2. - 1.);
    vec2 q1 = c*.32 - v*p1*1.6, q2 = c*.32 - v*p2*1.6 + 7.3;
    vec2 rip = mix(gradN(q1), gradN(q2), w)*(.05 + min(sp, 2.5)*.1);
    vec3 N = normalize(vec3(-(gh*1.6 + rip), 1.));
    vec3 bed = sand(uv + N.xy*min(d, 3.)*.0045);
    vec2 cq = c*.22 + N.xy*2.;
    float cz = pow(1. - abs(n2(cq + TIME*.18) - n2(cq*1.3 - TIME*.14 + 4.)), 7.);
    bed += vec3(1., .93, .78)*cz*.45*exp(-d*.7)*smoothstep(.0, .15, d);
    float turb = clamp(s.z*1.6, 0., .8);
    vec3 T = exp(-d*mix(vec3(.5, .22, .17), vec3(.3, .38, .5), turb)*1.3);
    vec3 deep = mix(vec3(.05, .2, .22), vec3(.38, .28, .16), turb);
    vec3 wc = bed*T + deep*(1. - T);
    vec3 rd = reflect(vec3(0., 0., -1.), N);
    float fres = .02 + .98*pow(1. - N.z, 5.);
    wc = mix(wc, vec3(.78, .87, .95), clamp(fres*6., 0., .4));
    wc += vec3(1., .96, .88)*pow(max(dot(rd, SUN), 0.), 220.)*2.2;
    float fn = mix(fbm(q1*2.3), fbm(q2*2.3 + 3.), w);
    float foam = smoothstep(.55, .8, fn)*smoothstep(1.6, 3.6, sp)*.8;
    foam += (1. - smoothstep(.0, .07, d))*smoothstep(.4, 1.4, sp)*.25;
    foam += smoothstep(.9, 2.2, length(gh))*smoothstep(.5, .75, fn)*.5;
    wc = mix(wc, vec3(.96, .95, .9), clamp(foam, 0., .85));
    col = mix(col, wc, smoothstep(.0015, .05, d));
  }
  col *= mix(.78, 1., smoothstep(1.2, .35, length(uv - .5)*1.3));
  col += (h(gl_FragCoord.xy + fract(TIME)*50.) - .5)*.015;
  o = vec4(col, 1.);
}`;
const FS_REDUCE = `#version 300 es
precision highp float; uniform sampler2D ST, VEL; uniform vec2 R; layout(location=0) out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy/R; float d = texture(ST, uv).y; float s = length(texture(VEL, uv).xy);
  o = vec4(clamp(s*min(d, 1.)/2., 0., 1.), step(.02, d), 0., 1.); }`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, shader(gl.VERTEX_SHADER, VS)); gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const P = { init: program(FS_INIT), clear: program(FS_CLEAR), flux: program(FS_FLUX), water: program(FS_WATER), sedi: program(FS_SEDI), draw: program(FS_DRAW), reduce: program(FS_REDUCE) };
gl.bindVertexArray(gl.createVertexArray());
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

function tex(w, h, internal, format, type, filter) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, format, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function fbo(...ts) {
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  ts.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
  gl.drawBuffers(ts.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
  return f;
}
const F32 = () => tex(GW, GH, gl.RGBA32F, gl.RGBA, gl.FLOAT, LINEAR_OK ? gl.LINEAR : gl.NEAREST);

let GW = 0, GH = 0, stA, stB, flA, flB, vel, fStB_vel, fStA, fFlA, fFlB, seed = Math.random() * 100;
const RW = 32, RH = 20;
const redTex = tex(RW, RH, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, gl.NEAREST), redFbo = fbo(redTex), redBuf = new Uint8Array(RW * RH * 4);
function alloc(w, h) {
  for (const t of [stA, stB, flA, flB, vel]) if (t) gl.deleteTexture(t);
  GW = w; GH = h;
  stA = F32(); stB = F32(); flA = F32(); flB = F32(); vel = F32();
  fStA = fbo(stA); fStB_vel = fbo(stB, vel); fFlA = fbo(flA); fFlB = fbo(flB);
  reset(false);
}
function run(prog, target, w, h) { gl.bindFramebuffer(gl.FRAMEBUFFER, target); gl.viewport(0, 0, w, h); gl.useProgram(prog.p); gl.drawArrays(gl.TRIANGLES, 0, 3); }
function common(u) { gl.uniform2f(u.G, GW, GH); gl.uniform1f(u.SEED, seed); }
function bind(unit, t, loc) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(loc, unit); }
function reset(newSeed) {
  if (newSeed) seed = Math.random() * 100;
  gl.useProgram(P.init.p); common(P.init.u); run(P.init, fStA, GW, GH);
  for (const f of [fFlA, fFlB]) run(P.clear, f, GW, GH);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fStB_vel); gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]); gl.clearBufferfv(gl.COLOR, 1, [0, 0, 0, 0]);
}

// ---------- state ----------
let Q = .6, srcOff = 0, time = 0, brush = [0, 0, 7, 0];
const hand = { down: false, x: 0, y: 0, px: 0, py: 0, dig: false, push: false };
let pushU = [0, 0, 0, 0];
let tool = 'pile', shift = false, flowLevel = 0, wetShare = 0;

function meander(y) { return GW * .5 + Math.sin(y * .017 + seed) * GW * .15 + Math.sin(y * .043 + seed * 2.3) * GW * .05; }

function step(applyBrush) {
  // flux
  gl.useProgram(P.flux.p); let u = P.flux.u; common(u); gl.uniform1f(u.DT, DT);
  bind(0, stA, u.ST); bind(1, flA, u.FL); run(P.flux, fFlB, GW, GH);
  [flA, flB] = [flB, flA]; [fFlA, fFlB] = [fFlB, fFlA];
  // water + erosion
  gl.useProgram(P.water.p); u = P.water.u; common(u);
  gl.uniform1f(u.DT, DT); gl.uniform1f(u.Q, Q); gl.uniform1f(u.SRC, meander(GH - 1) + srcOff);
  gl.uniform1f(u.KC, 1.2); gl.uniform1f(u.KS, .02); gl.uniform1f(u.KD, .006);
  bind(0, stA, u.ST); bind(1, flA, u.FL); run(P.water, fStB_vel, GW, GH);
  // sediment + slumping + hand
  gl.useProgram(P.sedi.p); u = P.sedi.u; common(u); gl.uniform1f(u.DT, DT);
  gl.uniform4f(u.BR, brush[0], brush[1], brush[2], applyBrush ? brush[3] : 0);
  gl.uniform4fv(u.PU, pushU);
  bind(0, stB, u.ST); bind(1, vel, u.VEL); run(P.sedi, fStA, GW, GH);
}
function draw() {
  gl.useProgram(P.draw.p); const u = P.draw.u; common(u);
  gl.uniform2f(u.R, canvas.width, canvas.height); gl.uniform1f(u.TIME, time);
  bind(0, stA, u.ST); bind(1, vel, u.VEL);
  run(P.draw, null, canvas.width, canvas.height);
}
function measure() {
  gl.useProgram(P.reduce.p); const u = P.reduce.u; gl.uniform2f(u.R, RW, RH);
  bind(0, stA, u.ST); bind(1, vel, u.VEL); run(P.reduce, redFbo, RW, RH);
  gl.readPixels(0, 0, RW, RH, gl.RGBA, gl.UNSIGNED_BYTE, redBuf);
  let a = 0, w = 0; for (let i = 0; i < redBuf.length; i += 4) { a += redBuf[i]; w += redBuf[i + 1]; }
  flowLevel = a / 255 / (RW * RH); wetShare = w / 255 / (RW * RH);
}

let cw = 0, ch = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = innerWidth; ch = innerHeight;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  const scale = Math.min(1 / 2.6, 460 / Math.max(cw, ch));
  const w = Math.max(96, Math.round(cw * scale)), h = Math.max(96, Math.round(ch * scale));
  if (!GW || Math.abs(w - GW) / GW > .2 || Math.abs(h - GH) / GH > .2) { alloc(w, h); prewarm(); }
}
function prewarm() { for (let i = 0; i < (REDUCED ? 700 : 1600); i++) step(false); }

// ---------- sound: a brook made of filtered noise; sand hisses when poured ----------
let AC = null, SND = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
  try { AC = new C(); } catch { return; }
  const len = AC.sampleRate * 3, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  let last = 0; for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .04 * w) / 1.04; d[i] = last * 3.2; }
  const white = AC.createBuffer(1, len, AC.sampleRate), wd = white.getChannelData(0); for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
  const src = (b) => { const s = AC.createBufferSource(); s.buffer = b; s.loop = true; s.start(0, Math.random() * 2); return s; };
  SND.master = AC.createGain(); SND.master.gain.value = 0; SND.master.gain.linearRampToValueAtTime(.9, AC.currentTime + 3);
  SND.master.connect(AC.destination);
  SND.brook = AC.createGain(); SND.brook.gain.value = 0; SND.brook.connect(SND.master);
  SND.bands = [380, 820, 1500, 2600].map((f, i) => {
    const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = 4 + i;
    const g = AC.createGain(); g.gain.value = .2; src(white).connect(bp); bp.connect(g); g.connect(SND.brook);
    return { bp, g, f, phase: Math.random() * 10 };
  });
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
  SND.rumble = AC.createGain(); SND.rumble.gain.value = 0; src(buf).connect(lp); lp.connect(SND.rumble); SND.rumble.connect(SND.master);
  const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
  SND.hiss = AC.createGain(); SND.hiss.gain.value = 0; src(white).connect(hp); hp.connect(SND.hiss); SND.hiss.connect(SND.master);
}
function audioTick(dt) {
  if (!AC) return;
  const t = AC.currentTime, f = Math.min(1, flowLevel * 4);
  SND.brook.gain.setTargetAtTime(.05 + f * .5, t, .6);
  SND.rumble.gain.setTargetAtTime(.02 + f * .12, t, .8);
  SND.hiss.gain.setTargetAtTime(hand.down ? (hand.push ? Math.min(.12, Math.hypot(pushU[2], pushU[3]) * .4) : hand.dig ? .05 : .09) : 0, t, .05);
  for (const b of SND.bands) {
    b.phase += dt * (3 + Math.random() * 6);
    const babble = .5 + .5 * Math.sin(b.phase) * Math.sin(b.phase * .37 + 1);
    b.g.gain.setTargetAtTime(.06 + babble * .22, t, .03);
    b.bp.frequency.setTargetAtTime(b.f * (.85 + babble * .35), t, .05);
  }
}

// ---------- input ----------
function toGrid(e) { return [e.clientX / cw * GW, (1 - e.clientY / ch) * GH]; }
function setTool(t) { tool = t; for (const [id, n] of [['tPile', 'pile'], ['tPush', 'push'], ['tDig', 'dig']]) $(id).setAttribute('aria-pressed', String(t === n)); }
$('tPile').onclick = () => setTool('pile');
$('tDig').onclick = () => setTool('dig');
$('tPush').onclick = () => setTool('push');
canvas.addEventListener('pointerdown', e => {
  initAudio();
  canvas.setPointerCapture(e.pointerId);
  hand.down = true; [hand.x, hand.y] = toGrid(e);
  hand.dig = e.button === 2 || e.shiftKey || tool === 'dig';
  hand.push = !hand.dig && (e.button === 1 || e.altKey || tool === 'push');
  hand.px = hand.x; hand.py = hand.y;
  if (e.button === 1) e.preventDefault();
  touched();
});
canvas.addEventListener('pointermove', e => { [hand.x, hand.y] = toGrid(e); if (hand.down) hand.dig = hand.dig || e.shiftKey; });
const up = () => { hand.down = false; };
canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
addEventListener('contextmenu', e => e.preventDefault());
let meterTimer;
addEventListener('wheel', e => {
  e.preventDefault();
  Q = Math.min(1.4, Math.max(.04, Q * Math.exp(-e.deltaY * .0012)));
  $('meterFill').style.height = `${(Math.log(Q / .04) / Math.log(1.4 / .04)) * 100}%`;
  $('meter').classList.remove('gone'); clearTimeout(meterTimer); meterTimer = setTimeout(() => $('meter').classList.add('gone'), 1400);
  touched();
}, { passive: false });
addEventListener('keydown', e => {
  initAudio();
  if (e.key === 'Shift') shift = true;
  if (e.key === '1') setTool('pile');
  if (e.key === '2') setTool('push');
  if (e.key === '3') setTool('dig');
  if (e.key === 'r' || e.key === 'R') { reset(true); prewarm(); }
  if (e.key === 'ArrowUp') { Q = Math.min(1.4, Q * 1.2); }
  if (e.key === 'ArrowDown') { Q = Math.max(.04, Q / 1.2); }
});
addEventListener('keyup', e => { if (e.key === 'Shift') shift = false; });
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (!AC) return; document.hidden ? AC.suspend() : AC.resume(); });
let lastTouch = performance.now();
function touched() { lastTouch = performance.now(); }

// ---------- loop ----------
let last = performance.now(), born = performance.now(), measureAt = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
  srcOff = Math.sin(time * .011) * GW * .006;
  const dig = hand.dig || (hand.down && shift);
  const pushing = hand.down && hand.push && !dig;
  brush = [hand.x, hand.y, Math.max(4, GW * .018), hand.down && !pushing ? (dig ? -.45 : .3) * dt * 60 : 0];
  let mx = hand.x - hand.px, my = hand.y - hand.py; hand.px = hand.x; hand.py = hand.y;
  const ml = Math.hypot(mx, my), cap = .9 * STEPS;
  if (ml > cap) { mx *= cap / ml; my *= cap / ml; }
  pushU = pushing ? [hand.x, hand.y, mx / STEPS, my / STEPS] : [0, 0, 0, 0];
  for (let i = 0; i < STEPS; i++) step(i === 0 && hand.down && !pushing);
  draw();
  if (now - measureAt > 400) { measureAt = now; measure(); }
  audioTick(dt);
  const age = (now - born) / 1000;
  $('title').classList.toggle('gone', age > 6);
  $('hint').classList.toggle('gone', age > 16 && now - lastTouch < 60000);
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
